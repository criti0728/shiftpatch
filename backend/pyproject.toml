[project]
name = "shiftpatch-api"
version = "0.1.0"
description = "ShiftPatch sample café operations and agent API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
gemini = ["google-genai>=1.75,<2"]
cloud = ["firebase-admin>=6.7,<8", "google-cloud-firestore>=2.20,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
